[package]
name = "ai-agent-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
