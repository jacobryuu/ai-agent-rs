[package]
name = "ai-agent-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
glob = "0.3"
lancedb = "0.15"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
hf-hub = "0.4"
arrow-array = "53"
arrow-schema = "53"
tokenizers = "0.20"
futures = "0.3"
lance-arrow = "0.22"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
